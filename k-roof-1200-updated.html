<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Roof</title>
<style>
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Arial,"Noto Sans Thai",sans-serif;
    background:#f5f5f5;
    color:#111;
  }
  .wrap{
    width:min(900px,94vw);
    margin:30px auto;
  }
  .card{
    background:#fff;
    border-radius:24px;
    padding:34px 28px 28px;
    box-shadow:0 12px 35px rgba(0,0,0,.12);
    text-align:center;
    overflow:hidden;
  }
  .expired{
    color:#e00000;
    font-size:clamp(32px,6vw,58px);
    font-weight:1000;
    line-height:1.05;
    margin-bottom:18px;
  }
  .logo{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:100px;height:100px;
    border:5px solid #c99a28;
    border-radius:50%;
    background:#111;
    font-weight:900;
    font-size:34px;
    margin-bottom:18px;
    letter-spacing:-2px;
  }
  .logo .k{color:#ffd21a}
  .logo .roof{color:#1687d9}
  .free{
    color:#e00000;
    font-size:clamp(34px,7vw,68px);
    line-height:1.05;
    font-weight:1000;
    margin:5px 0 14px;
  }
  .cheap{
    color:#000;
    font-size:clamp(32px,6.5vw,62px);
    line-height:1.05;
    font-weight:1000;
    margin:0 0 28px;
  }
  .price{
    background:#111;
    color:#fff;
    border-radius:18px;
    padding:18px 20px;
    font-size:clamp(27px,5vw,48px);
    font-weight:900;
    margin-bottom:24px;
  }
  .chat{
    max-width:650px;
    margin:0 auto 25px;
    text-align:left;
  }
  .msg{
    margin:12px 0;
    padding:14px 18px;
    border-radius:18px;
    font-size:clamp(21px,3.8vw,31px);
    font-weight:800;
  }
  .q{background:#eee}
  .a{background:#e9f7e9;color:#087a18}
  .final{
    background:#e00000;
    color:#fff;
    padding:18px;
    border-radius:18px;
    font-size:clamp(28px,5vw,46px);
    font-weight:1000;
    margin-top:10px;
  }
  .phone{
    margin-top:25px;
    font-size:clamp(25px,4.5vw,40px);
    font-weight:1000;
    color:#111;
  }
  .bank{
    margin-top:18px;
    background:#fff3f3;
    border:4px solid #e00000;
    border-radius:18px;
    padding:16px 12px;
    color:#111;
  }
  .bank-name{
    font-size:clamp(22px,4vw,34px);
    font-weight:900;
    margin-bottom:4px;
  }
  .bank-number{
    color:#e00000;
    font-size:clamp(38px,7vw,64px);
    line-height:1;
    font-weight:1000;
    letter-spacing:2px;
  }
  @media(max-width:500px){
    .card{padding:25px 16px 22px;border-radius:18px}
    .logo{width:82px;height:82px;font-size:28px}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">

    <div class="expired">หมดเวลาใช้ฟรี</div>

    <div class="logo">
      <span class="k">K</span><span class="roof">Roof</span>
    </div>

    <div class="free">ให้ใช้ฟรี<br>ไม่มีใครสนใจ</div>

    <div class="cheap">ขาย 300 ก็มองไร้ค่า</div>

    <div class="price">ใครสนใจ ขาย 1,500 บาท</div>

    <div class="chat">
      <div class="msg q">- ลดได้มั้ย?</div>
      <div class="msg a">- ได้ ให้ 1,400</div>

      <div class="msg q">- กันเองลงอีกหน่อยดิ</div>
      <div class="msg a">- OK 1,200 ต่ำกว่านี้มารยาทนิดหนึ่งนะคะ</div>
    </div>

    <div class="final">🔥 1,200 บาท 🔥</div>

    <div class="phone">โทร 092-796-8777</div>

    <div class="bank">
      <div class="bank-name">ธนาคารกรุงเทพ</div>
      <div class="bank-number">0587482605</div>
    </div>

  </div>
</div>
</body>
</html>
